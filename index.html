<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juneteenth Freedom BBQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #0a0a0a;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        @keyframes pulse-gold {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-gold { animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="text-slate-100">
    <div id="root">
        <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
            <div class="w-16 h-16 border-4 border-red-600 border-t-transparent rounded-full animate-spin mb-6"></div>
            <h2 class="text-2xl font-black text-white uppercase italic tracking-tighter">Freedom Kitchen</h2>
            <p class="text-slate-500 text-xs mt-3 uppercase tracking-widest font-bold opacity-60">Preparing the communal table...</p>
        </div>
    </div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        const CATEGORIES = [
            { id: 'main', label: 'Main Dish', color: 'bg-red-900/30 text-red-400 border-red-800' },
            { id: 'side', label: 'Side / Greens', color: 'bg-green-900/30 text-green-400 border-green-800' },
            { id: 'drink', label: 'Drinks', color: 'bg-blue-900/30 text-blue-400 border-blue-800' },
            { id: 'dessert', label: 'Sweet Treats', color: 'bg-yellow-900/30 text-yellow-400 border-yellow-800' },
            { id: 'other', label: 'Other', color: 'bg-slate-800 text-slate-400 border-slate-700' },
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [items, setItems] = useState([]);
            const [formData, setFormData] = useState({ name: '', dish: '', category: 'main' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [error, setError] = useState(null);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiResponse, setAiResponse] = useState(null);
            const [showAiModal, setShowAiModal] = useState(false);
            
            const dbRef = useRef(null);
            const appIdRef = useRef(null);
            const apiKeyRef = useRef(""); // Environment will inject this

            useEffect(() => {
                const initApp = async () => {
                    try {
                        const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                        const firebaseConfig = JSON.parse(configStr);
                        
                        if (!firebaseConfig.apiKey) {
                            setError("Firebase configuration is missing. Please ensure the environment is ready.");
                            return;
                        }

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        dbRef.current = getFirestore(app);
                        appIdRef.current = typeof __app_id !== 'undefined' ? __app_id : 'juneteenth-potluck-v1';

                        const userCredential = await signInAnonymously(auth);
                        setUser(userCredential.user);

                        const potluckRef = collection(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'potluck_items');
                        const q = query(potluckRef, orderBy('timestamp', 'desc'));

                        const unsubscribe = onSnapshot(q, (snapshot) => {
                            const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setItems(docs);
                            setError(null);
                        }, (err) => {
                            console.error("Firestore Error:", err);
                            if (err.code === 'permission-denied') {
                                setError("Access Denied. Database rules are still propagating.");
                            }
                        });

                        return () => unsubscribe();
                    } catch (err) {
                        setError("Connection error. Check your internet.");
                    }
                };

                initApp();
                // Initialize Lucide icons
                setTimeout(() => lucide.createIcons(), 500);
            }, []);

            const callGemini = async (prompt, systemInstruction) => {
                setAiLoading(true);
                setAiResponse(null);
                setShowAiModal(true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKeyRef.current}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] }
                        })
                    });
                    const result = await response.json();
                    setAiResponse(result.candidates?.[0]?.content?.parts?.[0]?.text);
                } catch (err) {
                    setAiResponse("Heritage kitchen is busy right now. Try again later!");
                } finally {
                    setAiLoading(false);
                }
            };

            const getRecipe = (dishName) => {
                const prompt = `Provide a traditional Juneteenth recipe for: ${dishName}. Keep it soulful and detailed.`;
                callGemini(prompt, "You are a master chef specializing in African American heritage cuisine.");
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.dish || !user) return;
                
                setIsSubmitting(true);
                try {
                    const potluckRef = collection(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'potluck_items');
                    await addDoc(potluckRef, { 
                        ...formData, 
                        userId: user.uid, 
                        timestamp: Date.now() 
                    });
                    setFormData(prev => ({ ...prev, dish: '' }));
                } catch (err) {
                    setError("Failed to register. Try again.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const deleteItem = async (id, itemUserId) => {
                if (user?.uid !== itemUserId) return;
                try {
                    await deleteDoc(doc(dbRef.current, 'artifacts', appIdRef.current, 'public', 'data', 'potluck_items', id));
                } catch (err) {}
            };

            return (
                <div className="min-h-screen bg-[#0a0a0a] pb-20">
                    <div className="max-w-2xl mx-auto px-4 pt-8 animate-in fade-in duration-1000">
                        
                        {/* Header Section */}
                        <header className="text-center mb-8 relative">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-red-600/20 blur-3xl -z-10 rounded-full"></div>
                            <h1 className="text-6xl font-black italic text-red-600 uppercase tracking-tighter leading-none mb-1">FREEDOM</h1>
                            <div className="flex items-center justify-center gap-3">
                                <h2 className="text-4xl font-black italic text-white uppercase tracking-tighter leading-none">POTLUCK</h2>
                                <span className="bg-green-600 text-white text-[10px] font-black px-2 py-1 rounded-lg uppercase tracking-widest mt-1">2024</span>
                            </div>
                        </header>

                        {/* Status Stats */}
                        <div className="grid grid-cols-5 gap-2 mb-10">
                            {CATEGORIES.map(cat => {
                                const count = items.filter(i => i.category === cat.id).length;
                                return (
                                    <div key={cat.id} className={`${cat.color} rounded-2xl p-3 text-center border shadow-lg transition-transform hover:scale-105`}>
                                        <div className="text-xl font-black">{count}</div>
                                        <div className="text-[7px] font-black uppercase tracking-tighter opacity-80 leading-tight">{cat.label.split(' ')[0]}</div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Registration Form */}
                        <section className="bg-slate-900/50 backdrop-blur-xl p-6 rounded-[2.5rem] border border-slate-800 shadow-2xl mb-12">
                            <h3 className="text-yellow-500 font-black uppercase italic tracking-widest text-[10px] mb-4 flex items-center gap-2">
                                <span className="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span>
                                Register Your Contribution
                            </h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="space-y-4">
                                    <input 
                                        required 
                                        className="w-full bg-slate-800/80 p-4 rounded-2xl border border-slate-700 text-white outline-none focus:ring-2 focus:ring-red-600 transition-all placeholder:text-slate-500" 
                                        placeholder="Your Full Name" 
                                        value={formData.name} 
                                        onChange={e => setFormData({...formData, name: e.target.value})} 
                                    />
                                    <input 
                                        required 
                                        className="w-full bg-slate-800/80 p-4 rounded-2xl border border-slate-700 text-white outline-none focus:ring-2 focus:ring-green-600 transition-all placeholder:text-slate-500" 
                                        placeholder="What are you bringing? (e.g. Ribs)" 
                                        value={formData.dish} 
                                        onChange={e => setFormData({...formData, dish: e.target.value})} 
                                    />
                                    <div className="grid grid-cols-2 gap-2">
                                        {CATEGORIES.map(cat => (
                                            <button 
                                                key={cat.id}
                                                type="button"
                                                onClick={() => setFormData({...formData, category: cat.id})}
                                                className={`p-3 rounded-xl border text-[9px] font-black uppercase tracking-widest transition-all ${formData.category === cat.id ? cat.color + ' border-white/20' : 'bg-slate-800 border-transparent text-slate-500 opacity-60'}`}
                                            >
                                                {cat.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <button type="submit" disabled={isSubmitting || !user} className="w-full bg-red-600 hover:bg-red-700 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-[0_6px_0_rgb(153,27,27)] active:translate-y-1 active:shadow-none transition-all disabled:opacity-50 mt-2">
                                    {isSubmitting ? 'Recording...' : 'Add to the Feast'}
                                </button>
                            </form>
                        </section>

                        {/* Communit Table / List */}
                        <section className="space-y-4">
                            <div className="flex items-center gap-4 mb-6">
                                <h4 className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500 italic">Community Table</h4>
                                <div className="h-px flex-1 bg-slate-800"></div>
                            </div>

                            {items.length === 0 ? (
                                <div className="text-center py-20 bg-slate-900/20 rounded-[2.5rem] border border-dashed border-slate-800">
                                    <p className="text-slate-700 uppercase text-[10px] font-black tracking-[0.2em]">Waiting for the first dish...</p>
                                </div>
                            ) : (
                                <div className="grid gap-4">
                                    {items.map(item => {
                                        const cat = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[4];
                                        return (
                                            <div key={item.id} className="bg-slate-900/60 backdrop-blur-md p-5 rounded-[2rem] border border-slate-800 flex justify-between items-center group animate-in slide-in-from-bottom-2 duration-500">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <p className="font-black text-xl text-white tracking-tight">{item.dish}</p>
                                                        <button 
                                                            onClick={() => getRecipe(item.dish)}
                                                            className="bg-yellow-500/10 text-yellow-500 text-[8px] font-black px-2 py-0.5 rounded border border-yellow-500/20 hover:bg-yellow-500 hover:text-black transition-colors"
                                                        >
                                                            RECIPE
                                                        </button>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest italic">From <span className="text-slate-300">{item.name}</span></span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className={`${cat.color} text-[8px] font-black uppercase px-3 py-2 rounded-xl border border-white/5`}>
                                                        {cat.id}
                                                    </div>
                                                    {user?.uid === item.userId && (
                                                        <button onClick={() => deleteItem(item.id, item.userId)} className="text-slate-700 hover:text-red-500 p-2">
                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </section>
                    </div>

                    {/* AI Wisdom Modal */}
                    {showAiModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 w-full max-w-lg rounded-[2.5rem] border border-slate-800 shadow-2xl overflow-hidden flex flex-col">
                                <div className="p-5 bg-gradient-to-r from-red-800 to-red-950 text-white flex justify-between items-center border-b-2 border-yellow-500">
                                    <h3 className="font-black italic uppercase tracking-tighter flex items-center gap-2">
                                        <i data-lucide="utensils-crosses" className="w-5 h-5 text-yellow-400"></i>
                                        Heritage Kitchen
                                    </h3>
                                    <button onClick={() => setShowAiModal(false)} className="hover:bg-black/20 p-2 rounded-full transition">
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>
                                </div>
                                
                                <div className="p-8 max-h-[60vh] overflow-y-auto custom-scrollbar">
                                    {aiLoading ? (
                                        <div className="flex flex-col items-center justify-center py-20 gap-6">
                                            <div className="w-12 h-12 border-4 border-yellow-500/20 border-t-yellow-500 rounded-full animate-spin"></div>
                                            <p className="text-yellow-500 font-black uppercase tracking-[0.2em] text-[10px] animate-pulse">Asking the Elders...</p>
                                        </div>
                                    ) : (
                                        <div className="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">
                                            {aiResponse}
                                        </div>
                                    )}
                                </div>

                                <div className="p-6 bg-slate-950/50 border-t border-slate-800 flex justify-end">
                                    <button 
                                        onClick={() => setShowAiModal(false)}
                                        className="px-10 py-4 bg-green-700 text-white font-black uppercase tracking-widest rounded-2xl hover:bg-green-600 transition shadow-[0_4px_0_rgb(21,128,61)] active:translate-y-1 active:shadow-none text-[11px]"
                                    >
                                        Got the wisdom
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
